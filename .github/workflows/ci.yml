name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Pinned runtime (CPython + ripgrep, SHA-256 verified)
        run: python3 scripts/bootstrap-runtime.py
      - name: Collector payload
        run: python3 scripts/prepare-runtime.py
      - name: Source audit
        run: python3 scripts/audit.py
      - name: Build
        run: swift build
      - name: Swift tests (XCTest)
        run: swift test
      - name: Swift tests (Command Line Tools adapter)
        run: python3 scripts/native-tests.py
      - name: CLI integration tests
        run: python3 scripts/test-port.py
      - name: Upstream collector fixtures
        run: |
          brew install bash
          python3 scripts/test-collectors.py --bash "$(brew --prefix)/bin/bash"
      - name: Package
        run: python3 scripts/package-app.py --skip-runtime
      - name: Release audit
        run: python3 scripts/audit.py --dist
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDeck-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.arch }}
          path: artifacts/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "AgentDeck $GITHUB_REF_NAME" --notes "See README and docs/validation.md."
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
